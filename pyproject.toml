[project]
name = "domovyk"
version = "0.0.1"
description = "Домовик — пряма оренда житла у Львові без ріелторів"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "cryptography>=43",
    "tzdata>=2024.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "weasyprint>=63",
    "jinja2>=3.1",
    "asn1crypto>=1.5",
    "pillow>=11",
    "imagehash>=4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "psycopg[binary]>=3.2",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domovyk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кирилиця в рядках і коментарях — це норма

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["domovyk"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["domovyk.domain.*", "domovyk.modules.*"]
strict = true

[[tool.mypy.overrides]]
module = ["arq.*", "weasyprint.*", "asn1crypto.*", "imagehash.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: потребує Docker (testcontainers)"]
